name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast-semgrep:
    name: SAST - Analisis Estatico (Semgrep)
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Ejecutar escaneo Semgrep (Reglas OWASP y JavaScript)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan --config=p/javascript --config=p/secrets --metrics=off
